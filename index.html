<!doctype html>
<html lang="en" class="bg-[#070611] text-neutral-100" style="background-color: #070611; color: #f8fafc; height: 100%; width: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Studio</title>
    <meta name="description" content="Professional WebGL GPU-accelerated non-destructive photo editing suite with RGB Curves, Selective Masking, HSL Color Mixer, Pro Presets, and Gemini AI Auto-Enhance." />
    <meta property="og:title" content="Lumina Studio" />
    <meta property="og:description" content="Professional WebGL GPU-accelerated non-destructive photo editing suite with RGB Curves, Selective Masking, HSL Color Mixer, Pro Presets, and Gemini AI Auto-Enhance." />
    <style>
      html, body {
        background-color: #070611;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070611;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #d946ef;
        border-right-color: #a855f7;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 20px rgba(217, 70, 239, 0.4);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#070611] text-neutral-100" style="background-color: #070611; color: #f8fafc; margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spinner"></div>
        <p style="margin-top: 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1; opacity: 0.85;">
          Loading Lumina Studio...
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
